android.useAndroidX=true
# 项目已全部使用 AndroidX，无需进行旧 Support Library 转换。
android.enableJetifier=false

# 构建性能：复用守护进程、并行任务、配置缓存和本地构建缓存。
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
# GitHub-hosted runner has enough headroom for an 8 GiB Gradle heap; this
# reduces GC pressure during Kotlin, Compose, Hilt and Room/KSP compilation.
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.vfs.watch=false
kotlin.incremental=true

# KSP 替代 KAPT；保留 Kotlin 编译器进程隔离，避免与 Gradle 守护进程争抢内存。
ksp.incremental=true
kotlin.compiler.plugins.strongSkipping=true
