name: Beta runtime smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: beta-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref_name == 'beta'
    name: Beta emulator navigation smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Decode Beta test keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks

      - name: Run Beta runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        with:
          # Use a lighter Android 10 x86 image for the public runner. GitHub-hosted
          # Linux runners do not expose KVM, so the emulator must run without
          # hardware acceleration; the smaller image is substantially more
          # reliable than the API 34 x86_64 image in software emulation.
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: android
          script: ./gradlew connectedBetaReleaseAndroidTest --no-configuration-cache --no-daemon

      - name: Remove temporary keystore
        if: always()
        working-directory: android
        run: rm -f release.jks
