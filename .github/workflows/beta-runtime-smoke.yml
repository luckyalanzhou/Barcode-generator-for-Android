name: Beta runtime smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: beta-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref_name == 'beta'
    name: Beta emulator navigation smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run Beta runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Use a lighter API 30 x86 image for the public runner. GitHub-hosted
          # Linux runners do not expose KVM, so the emulator must run without
          # hardware acceleration; the smaller image is substantially more
          # reliable than the API 34 x86_64 image in software emulation.
          api-level: 30
          target: default
          arch: x86
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: android
          script: ./gradlew connectedBetaReleaseAndroidTest --no-configuration-cache --no-daemon
