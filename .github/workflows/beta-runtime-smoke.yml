name: Beta runtime smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref_name == 'beta'
    name: Beta emulator navigation smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run Beta runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: android
          script: ./gradlew connectedBetaReleaseAndroidTest --no-configuration-cache --no-daemon
