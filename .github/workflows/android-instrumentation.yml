name: Android Instrumentation Tests

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-data-instrumentation:
    name: Core data tests on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches/modules-2
            caches/jars-9
            caches/build-cache-1
            wrapper/dists

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run core data instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: ./android
          script: ./gradlew :core:data:connectedDebugAndroidTest --no-configuration-cache --max-workers=2

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-data-instrumentation-reports
          path: |
            android/core/data/build/reports/androidTests/connected/**
            android/core/data/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
