name: Architecture checks

on:
  pull_request:
    branches:
      - beta
      - main

permissions:
  contents: read

concurrency:
  group: architecture-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architecture:
    # Unset/false by default: the PR shows a skipped check until explicitly enabled.
    if: vars.ENABLE_ARCHITECTURE_PR_CHECKS == 'true'
    name: Verify architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.fork }}
          gradle-home-cache-includes: |
            caches/modules-2
            caches/jars-9
            wrapper/dists
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Check package and Gradle module boundaries
        run: ./gradlew :architecture-tests:test verifyArchitectureModuleDependencies --no-configuration-cache
