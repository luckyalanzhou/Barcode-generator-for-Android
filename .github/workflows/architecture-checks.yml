name: Architecture checks

on:
  pull_request:
    branches:
      - beta
      - main

permissions:
  contents: read

concurrency:
  group: architecture-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architecture:
    # 保留现有 job/check 名称，避免无必要地改变仓库外部的分支保护检查上下文。
    name: Verify architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # PR 只消费发布工作流已经建立的缓存，不回写临时分支输出。
          cache-read-only: true
          gradle-home-cache-includes: |
            caches/modules-2
            caches/jars-9
            wrapper/dists
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run complete local verification without packaging APK
        # 统一门禁包含架构/单元测试、Beta/Official Release 编译和 Lint；不打包或签名 APK。
        run: >-
          ./gradlew
          verifyLocal
          --no-configuration-cache
          -PenableAppUnitTests=true
