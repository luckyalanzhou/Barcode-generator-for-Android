name: Build Android Testing APK

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '测试版版本增量，例如 0.0.1 会将 1.0.5 构建为 1.0.6'
        required: true
        default: '0.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'beta'
    name: Assemble signed testing release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dfile.encoding=UTF-8
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dkotlin.incremental=true
        -Dkapt.incremental.apt=true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Read app version
        id: app-version
        run: |
          set -euo pipefail
          base_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          base_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=.*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          bump="${{ inputs.version_bump }}"
          IFS=. read -r base_major base_minor base_patch <<< "$base_version"
          IFS=. read -r bump_major bump_minor bump_patch <<< "$bump"
          for part in "$base_major" "$base_minor" "$base_patch" "$bump_major" "$bump_minor" "$bump_patch"; do
            [[ "$part" =~ ^[0-9]+$ ]] || { echo "::error::版本号必须是 x.y.z 或增量 x.y.z"; exit 1; }
          done
          version_name="$((base_major + bump_major)).$((base_minor + bump_minor)).$((base_patch + bump_patch))"
          version_code=$((base_code + 1))
          echo "base=$base_version; bump=$bump; version=$version_name; versionCode=$version_code"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks
      - name: Build signed testing release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleBetaRelease -PversionName="${{ steps.app-version.outputs.version }}" -PversionCode="${{ steps.app-version.outputs.version_code }}" --build-cache --parallel --max-workers=4 --stacktrace
      - name: Prepare testing APK
        env:
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/beta/release/app-beta-release.apk"
          target_apk="app/build/outputs/apk/beta/release/BarcodeGeneratorTest${VERSION_NAME}.apk"
          test -f "$source_apk" || { echo "::error::Testing APK not found"; exit 1; }
          mv "$source_apk" "$target_apk"
          ls -lh "$target_apk"
      - name: Upload testing APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorTest${{ steps.app-version.outputs.version }}-testing-build${{ github.run_number }}
          path: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish testing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v${{ steps.app-version.outputs.version }}
          name: BarcodeGenerator 测试版 ${{ steps.app-version.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Remove temporary keystore
        if: always()
        run: rm -f release.jks
