name: Build Android Beta APK

on:
  workflow_dispatch:
    inputs:
      refresh_gradle_cache:
        description: '刷新 Gradle 缓存（首次构建、依赖或 Gradle 配置变化时勾选）'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: android-testing-${{ github.ref }}
  # Beta 更新同一个稳定 Release，只保留最新等待构建，避免旧提交覆盖新版本。
  queue: single
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'beta'
    name: Assemble signed beta release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      version_code: ${{ steps.app-version.outputs.version_code }}
      sha256: ${{ steps.beta-apk.outputs.sha256 }}
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Calculate beta version
        id: app-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_file="beta-version.properties"
          test -f "$version_file" || { echo "::error::${version_file} not found"; exit 1; }
          release_json="$RUNNER_TEMP/beta-release.json"
          release_error="$RUNNER_TEMP/beta-release-error.txt"
          version_plan="$RUNNER_TEMP/beta-version-plan.json"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-test-v9.9.9" > "$release_json" 2> "$release_error"; then
            python3 tools/beta_release_version.py --properties "$version_file" --release-json "$release_json" --run-id "$GITHUB_RUN_ID" --output "$version_plan"
          elif grep -Eq 'HTTP 404([^0-9]|$)' "$release_error"; then
            python3 tools/beta_release_version.py --properties "$version_file" --release-not-found --output "$version_plan"
          else
            echo "::error::Could not query Beta Release metadata; refusing to reuse the initial versionCode."
            exit 1
          fi
          version_name="$(jq -r '.version_name' "$version_plan")"
          version_code="$(jq -er '.version_code' "$version_plan")"
          version_source="$(jq -r '.source' "$version_plan")"

          echo "base=9.9.9; version=$version_name; versionCode=$version_code; source=$version_source"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks
      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          check_dir="$RUNNER_TEMP/release-signing-check"
          check_jar="$RUNNER_TEMP/release-signing-check.jar"
          trap 'rm -rf "$check_dir" "$check_jar"' EXIT
          mkdir -p "$check_dir"
          jar --create --file "$check_jar" -C "$check_dir" .
          jarsigner \
            -keystore release.jks \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            "$check_jar" \
            "$KEY_ALIAS" >/dev/null
          echo "Release keystore, alias, and key password validation passed."
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 日常发布复用现有缓存但不重复回写；依赖或构建配置变化时，
          # 在 workflow_dispatch 页面勾选 refresh_gradle_cache 更新缓存。
          cache-read-only: ${{ !inputs.refresh_gradle_cache }}
          # setup-gradle v6 会分别处理任务输出与 transforms；这里只限定
          # Gradle User Home 中需要长期保留的依赖、脚本 JAR 和 Wrapper。
          gradle-home-cache-includes: |
            caches/modules-2
            caches/jars-9
            wrapper/dists
          cache-cleanup: on-success
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify the exact beta release commit
        run: ./gradlew verifyLocal --no-configuration-cache -PenableAppUnitTests=true
      - name: Build signed beta release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Beta versionCode changes on every run; remote release builds deliberately disable
        # Configuration Cache. Shared Gradle performance flags live in gradle.properties.
        # Beta lintVital is checked locally; keep the remote workflow focused on packaging the APK.
        run: ./gradlew assembleBetaRelease --no-configuration-cache -x :app:lintVitalBetaRelease -PversionName="${{ steps.app-version.outputs.version }}" -PversionCode="${{ steps.app-version.outputs.version_code }}"
      - name: Prepare beta APK
        id: beta-apk
        env:
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/beta/release/app-beta-release.apk"
          target_apk="app/build/outputs/apk/beta/release/BarcodeGeneratorBeta${VERSION_NAME}.apk"
          test -f "$source_apk" || { echo "::error::Testing APK not found"; exit 1; }
          mv "$source_apk" "$target_apk"
          sha256="$(sha256sum "$target_apk" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$target_apk"
          echo "APK SHA-256: $sha256"
      - name: Upload beta APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: BarcodeGeneratorBeta${{ steps.app-version.outputs.version }}-beta-build${{ github.run_number }}
          path: android/app/build/outputs/apk/beta/release/BarcodeGeneratorBeta${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          # 同一 run 恢复时允许替换上次的临时构建产物。
          overwrite: true
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f release.jks

  publish:
    if: github.ref_name == 'beta'
    needs: build
    name: Publish beta GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Release API calls use RELEASE_PUBLISH_TOKEN; keep GITHUB_TOKEN read-only.
    permissions:
      contents: read
    steps:
      - name: Download beta APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BarcodeGeneratorBeta${{ needs.build.outputs.version }}-beta-build${{ github.run_number }}
          path: beta-release
      - name: Publish beta GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: android-test-v9.9.9
          name: Barcode Generator Beta v${{ needs.build.outputs.version }}
          generate_release_notes: false
          body: |
            channel: beta
            versionName: ${{ needs.build.outputs.version }}
            versionCode: ${{ needs.build.outputs.version_code }}
            commit: ${{ github.sha }}
            workflowRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            sha256: ${{ needs.build.outputs.sha256 }}
          overwrite_files: true
          files: beta-release/BarcodeGeneratorBeta${{ needs.build.outputs.version }}.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Refresh beta Release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release edit android-test-v9.9.9 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Barcode Generator Beta v${VERSION_NAME}" \
            --notes "channel: beta
          versionName: ${VERSION_NAME}
          versionCode: ${VERSION_CODE}
          sha256: ${SHA256}
          commit: ${GITHUB_SHA}
          workflowRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
