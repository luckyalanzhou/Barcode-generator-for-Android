name: Build Android Testing APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'beta'
    name: Assemble signed testing release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dfile.encoding=UTF-8
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dkotlin.incremental=true
        -Dkapt.incremental.apt=true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Automatically bump beta version
        id: app-version
        run: |
          set -euo pipefail
          base_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          base_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=.*[[:space:]]([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$base_version" || { echo "::error::versionName not found"; exit 1; }
          test -n "$base_code" || { echo "::error::versionCode not found"; exit 1; }
          IFS=. read -r major minor patch <<< "$base_version"
          for part in "$major" "$minor" "$patch" "$base_code"; do
            [[ "$part" =~ ^[0-9]+$ ]] || { echo "::error::版本号格式无效"; exit 1; }
          done
          version_name="$major.$minor.$((patch + 1))"
          version_code=$((base_code + 1))
          sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\1${version_code}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName = \")[^\"]+(\".*)$/\1${version_name}\2/" app/build.gradle.kts
          # The version commit belongs only to beta; main is never changed by this workflow.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "beta: 自动升级版本到 ${version_name}"
          git push origin HEAD:beta
          echo "base=$base_version; version=$version_name; versionCode=$version_code"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks
      - name: Build signed testing release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleBetaRelease --build-cache --parallel --max-workers=4 --stacktrace
      - name: Prepare testing APK
        env:
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/beta/release/app-beta-release.apk"
          target_apk="app/build/outputs/apk/beta/release/BarcodeGeneratorTest${VERSION_NAME}.apk"
          test -f "$source_apk" || { echo "::error::Testing APK not found"; exit 1; }
          mv "$source_apk" "$target_apk"
          ls -lh "$target_apk"
      - name: Upload testing APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorTest${{ steps.app-version.outputs.version }}-testing-build${{ github.run_number }}
          path: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish testing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v${{ steps.app-version.outputs.version }}
          name: BarcodeGenerator 测试版 ${{ steps.app-version.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Remove temporary keystore
        if: always()
        run: rm -f release.jks
