name: Build Android Beta APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'beta'
    name: Assemble signed beta release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC
        -Dfile.encoding=UTF-8
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configuration-cache=true
        -Dorg.gradle.vfs.watch=false
        -Dkotlin.incremental=true
        -Dksp.incremental=true
        -Dkotlin.compiler.plugins.strongSkipping=true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          cache-read-only: false
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Automatically bump beta version
        id: app-version
        run: |
          set -euo pipefail
          test -f beta-version.properties || { echo "::error::beta-version.properties not found"; exit 1; }
          base_version="$(sed -nE 's/^versionName=([^[:space:]]+)$/\1/p' beta-version.properties)"
          base_code="$(sed -nE 's/^versionCode=([0-9]+)$/\1/p' beta-version.properties)"
          test -n "$base_version" || { echo "::error::versionName not found"; exit 1; }
          test -n "$base_code" || { echo "::error::versionCode not found"; exit 1; }
          IFS=. read -r major minor patch <<< "$base_version"
          for part in "$major" "$minor" "$patch" "$base_code"; do
            [[ "$part" =~ ^[0-9]+$ ]] || { echo "::error::版本号格式无效"; exit 1; }
          done
          version_name="$major.$minor.$((patch + 1))"
          version_code=$((base_code + 1))
          printf 'versionName=%s\nversionCode=%s\n' "$version_name" "$version_code" > beta-version.properties
          # Keep version state separate from Gradle build scripts so configuration cache remains reusable.
          git config user.name "luckyalanzhou"
          git config user.email "zhiminzhou1@gmail.com"
          git add beta-version.properties
          git commit -m "beta: 自动升级版本到 ${version_name}"
          git push origin HEAD:beta
          echo "base=$base_version; version=$version_name; versionCode=$version_code"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks
      - name: Build signed beta release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleBetaRelease -PversionName="${{ steps.app-version.outputs.version }}" -PversionCode="${{ steps.app-version.outputs.version_code }}"
      - name: Prepare beta APK
        env:
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/beta/release/app-beta-release.apk"
          target_apk="app/build/outputs/apk/beta/release/BarcodeGeneratorTest${VERSION_NAME}.apk"
          test -f "$source_apk" || { echo "::error::Testing APK not found"; exit 1; }
          mv "$source_apk" "$target_apk"
          ls -lh "$target_apk"
      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorTest${{ steps.app-version.outputs.version }}-beta-build${{ github.run_number }}
          path: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish beta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v${{ steps.app-version.outputs.version }}
          name: Barcode Generator Beta v${{ steps.app-version.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/beta/release/BarcodeGeneratorTest${{ steps.app-version.outputs.version }}.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Remove temporary keystore
        if: always()
        run: rm -f release.jks
