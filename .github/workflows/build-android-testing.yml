name: Build Android Beta APK

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'beta'
    name: Assemble signed beta release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      GRADLE_OPTS: >-
        -Dfile.encoding=UTF-8
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.vfs.watch=false
        -Dkotlin.incremental=true
        -Dksp.incremental=true
        -Dkotlin.compiler.plugins.strongSkipping=true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Beta builds run on a non-default branch; explicitly allow the
          # dependency cache to be saved for the next Beta build.
          cache-read-only: false
          # 只保留依赖和 Wrapper 缓存，避免把 build-cache、transforms
          # 和独立 configuration-cache 重复存入 GitHub Actions 缓存。
          gradle-home-cache-includes: |
            caches/modules-2
            caches/jars-9
            caches/build-cache-1
            wrapper/dists
          cache-cleanup: on-success
          add-job-summary: on-failure
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Calculate beta version
        id: app-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_file="beta-version.properties"
          test -f "$version_file" || { echo "::error::${version_file} not found"; exit 1; }
          base_version="$(sed -nE 's/^versionName=([^[:space:]]+)$/\1/p' "$version_file")"
          base_code="$(sed -nE 's/^versionCode=([0-9]+)$/\1/p' "$version_file")"
          test -n "$base_version" || { echo "::error::versionName not found"; exit 1; }
          test -n "$base_code" || { echo "::error::versionCode not found"; exit 1; }
          [[ "$base_version" == "9.9.9" ]] || { echo "::error::Beta versionName must remain 9.9.9"; exit 1; }
          [[ "$base_code" =~ ^[0-9]+$ ]] || { echo "::error::versionCode format is invalid"; exit 1; }

          # Beta 固定使用 9.9.9；versionCode 使用 workflow run number 递增。
          # 运行编号允许因失败构建产生空洞，但始终保证后续成功 APK 可升级覆盖旧版本。
          version_name="$base_version"
          version_code=$((base_code + GITHUB_RUN_NUMBER - 1))

          echo "base=$base_version; version=$version_name; versionCode=$version_code; run=$GITHUB_RUN_NUMBER"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks
      - name: Build signed beta release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Beta versionCode changes on every run; remote release builds deliberately disable
        # Configuration Cache. Local quick verification keeps it enabled through gradle.properties.
        run: ./gradlew assembleBetaRelease --no-configuration-cache -PversionName="${{ steps.app-version.outputs.version }}" -PversionCode="${{ steps.app-version.outputs.version_code }}"
      - name: Prepare beta APK
        id: beta-apk
        env:
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/beta/release/app-beta-release.apk"
          target_apk="app/build/outputs/apk/beta/release/BarcodeGeneratorBeta${VERSION_NAME}.apk"
          test -f "$source_apk" || { echo "::error::Testing APK not found"; exit 1; }
          mv "$source_apk" "$target_apk"
          sha256="$(sha256sum "$target_apk" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$target_apk"
          echo "APK SHA-256: $sha256"
      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: BarcodeGeneratorBeta${{ steps.app-version.outputs.version }}-beta-build${{ github.run_number }}
          path: android/app/build/outputs/apk/beta/release/BarcodeGeneratorBeta${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish beta GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-test-v9.9.9
          name: Barcode Generator Beta v${{ steps.app-version.outputs.version }}
          generate_release_notes: false
          body: |
            channel: beta
            versionName: ${{ steps.app-version.outputs.version }}
            versionCode: ${{ steps.app-version.outputs.version_code }}
            sha256: ${{ steps.beta-apk.outputs.sha256 }}
          overwrite_files: true
          files: android/app/build/outputs/apk/beta/release/BarcodeGeneratorBeta${{ steps.app-version.outputs.version }}.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Refresh beta Release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          VERSION_NAME: ${{ steps.app-version.outputs.version }}
          VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          SHA256: ${{ steps.beta-apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release edit android-test-v9.9.9 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Barcode Generator Beta v${VERSION_NAME}" \
            --notes "channel: beta
          versionName: ${VERSION_NAME}
          versionCode: ${VERSION_CODE}
          sha256: ${SHA256}"
      - name: Remove temporary keystore
        if: always()
        run: rm -f release.jks
